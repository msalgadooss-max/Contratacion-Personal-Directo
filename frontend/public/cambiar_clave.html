<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cambiar mi clave - ICAFAL</title>
<link rel="icon" href="../assets/img/logo-icafal-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Mismo tema de marca ICAFAL que el resto de la plataforma.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blue: {
            50: '#fdf5f2', 100: '#fae7e1', 200: '#fac9b7', 300: '#f7a587',
            400: '#f47c50', 500: '#f15922', 600: '#e1460e', 700: '#c03c0c',
            800: '#a23006', 900: '#802605', 950: '#531903',
          },
        },
        fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      },
    },
  }
</script>
<style>
  h1, h2, h3 { font-family: 'Manrope', 'Inter', ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="fixed top-0 inset-x-0 h-1.5 bg-gradient-to-r from-blue-500 via-blue-600 to-blue-700"></div>
  <div class="max-w-sm w-full mx-4 py-8">
    <img src="../assets/img/logo-icafal.png" alt="ICAFAL Ingeniería y Construcción" class="h-14 mx-auto mb-6">
    <h1 class="text-xl font-bold text-gray-900 text-center mb-2">Cambiar mi clave</h1>
    <p id="aviso-temporal" class="hidden text-sm text-center bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-4 py-3 mb-4">
      Entraste con una <b>clave temporal</b>. Por seguridad, elige una clave tuya para continuar.
    </p>
    <div id="alerta"></div>
    <form id="form-clave" class="bg-white shadow-md rounded-xl p-6 space-y-4 border-t-4 border-blue-600">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Clave actual</label>
        <input id="clave-actual" type="password" required autocomplete="current-password"
               class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Clave nueva <span class="text-gray-400 font-normal">(mínimo 8 caracteres)</span></label>
        <input id="clave-nueva" type="password" required minlength="8" autocomplete="new-password"
               class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Repite la clave nueva</label>
        <input id="clave-repetir" type="password" required minlength="8" autocomplete="new-password"
               class="w-full border border-gray-300 rounded-lg px-3 py-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
      </div>
      <button type="submit" id="btn-clave"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg py-3 transition">
        Guardar mi clave
      </button>
    </form>
    <p class="text-center text-xs mt-4"><a id="enlace-volver" href="login.html" class="text-gray-500 hover:text-gray-800 underline">Volver</a></p>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/cambiar-clave.js"></script>
</body>
</html>
