<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encuesta del proceso - ICAFAL</title>
<link rel="icon" href="../assets/img/logo-icafal-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
<!-- ICAFAL_TEMA_MARCA v1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Tema de marca ICAFAL (naranjo real extraido del logo, HSL escalado a
  // una paleta de 11 tonos). Reemplaza el "blue" por defecto de Tailwind
  // -- toda la app ya usaba blue-* como unico color de acento, asi que
  // esto recolorea todo sin tocar ninguna clase en el HTML existente.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blue: {
            50: '#fdf5f2', 100: '#fae7e1', 200: '#fac9b7', 300: '#f7a587',
            400: '#f47c50', 500: '#f15922', 600: '#e1460e', 700: '#c03c0c',
            800: '#a23006', 900: '#802605', 950: '#531903',
          },
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      },
    },
  }
</script>
<style>
  h1, h2, h3 { font-family: 'Manrope', 'Inter', ui-sans-serif, system-ui, sans-serif; }
  input[type="checkbox"], input[type="radio"] { accent-color: #e1460e; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-lg mx-auto px-4 py-8">
    <img src="../assets/img/logo-icafal.png" alt="ICAFAL Ingeniería y Construcción" class="h-14 mx-auto mb-4">
    <h1 class="text-2xl font-bold text-gray-900 text-center mb-1">¿Cómo te fue con el proceso?</h1>
    <p class="text-gray-500 text-sm text-center mb-4">Tu opinión nos ayuda a mejorarlo. Es anónima y toma menos de 2 minutos.</p>

    <!-- v10.15 (pedido explícito del usuario): barra de progreso -- como
         las 8 preguntas se muestran todas juntas (no una por pantalla),
         "avance" acá significa cuántas ya se respondieron, no en cuál
         está el usuario. Sticky para que se vea siempre al hacer scroll
         por un formulario largo. -->
    <div class="sticky top-0 z-10 bg-gray-50/95 backdrop-blur-sm -mx-4 px-4 pt-2 pb-3 mb-2">
      <div class="flex justify-between items-baseline text-xs font-medium text-gray-500 mb-1">
        <span id="progreso-texto">0 de 8 respondidas</span>
        <span id="progreso-porcentaje">0%</span>
      </div>
      <div class="w-full bg-gray-200 rounded-full h-2 overflow-hidden">
        <div id="progreso-barra" class="bg-blue-600 h-2 rounded-full transition-all duration-300" style="width:0%"></div>
      </div>
    </div>

    <form id="form-encuesta" class="space-y-4">
      <div id="preguntas" class="space-y-4"></div>

      <div class="bg-white shadow-sm rounded-xl p-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">¿Algo que deberíamos mejorar? <span class="text-gray-400 font-normal">(opcional)</span></label>
        <textarea id="comentario" rows="3" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none"></textarea>
      </div>

      <div class="bg-white shadow-sm rounded-xl p-4 grid grid-cols-2 gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tu edad</label>
          <input id="edad" type="number" min="15" max="90" inputmode="numeric" required
                 class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Cargo que probaste <span class="text-gray-400 font-normal">(opcional)</span></label>
          <input id="cargo_probado" type="text" placeholder="Ej: Jornal Concretero" class="w-full border border-gray-300 rounded-lg px-3 py-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
        </div>
      </div>
      <p class="text-xs text-gray-400 text-center -mt-2">No pedimos tu nombre -- esta encuesta es anónima.</p>

      <div id="alerta"></div>

      <button type="submit" id="btn-enviar"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg py-3 transition">
        Enviar respuestas
      </button>
    </form>

    <div id="resultado" class="hidden bg-green-50 border border-green-200 rounded-xl p-8 text-center">
      <div class="text-green-600 text-4xl">✔</div>
      <h2 class="text-lg font-bold text-gray-900 mt-2">¡Gracias por tu tiempo!</h2>
      <p class="text-sm text-gray-600 mt-1">Tu respuesta nos ayuda a mejorar el proceso.</p>
    </div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/encuesta.js"></script>
</body>
</html>
