<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corregir documento - ICAFAL</title>
<link rel="icon" href="../assets/img/logo-icafal-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
<!-- ICAFAL_TEMA_MARCA v1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Tema de marca ICAFAL (naranjo real extraido del logo, HSL escalado a
  // una paleta de 11 tonos). Reemplaza el "blue" por defecto de Tailwind
  // -- toda la app ya usaba blue-* como unico color de acento, asi que
  // esto recolorea todo sin tocar ninguna clase en el HTML existente.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blue: {
            50: '#fdf5f2', 100: '#fae7e1', 200: '#fac9b7', 300: '#f7a587',
            400: '#f47c50', 500: '#f15922', 600: '#e1460e', 700: '#c03c0c',
            800: '#a23006', 900: '#802605', 950: '#531903',
          },
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      },
    },
  }
</script>
<style>
  h1, h2, h3 { font-family: 'Manrope', 'Inter', ui-sans-serif, system-ui, sans-serif; }
  input[type="checkbox"], input[type="radio"] { accent-color: #e1460e; }
</style>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-md mx-auto px-4 py-8">
    <div class="text-center mb-6">
      <img src="../assets/img/logo-icafal.png" alt="ICAFAL Ingeniería y Construcción" class="h-16 mx-auto mb-4">
      <h1 class="text-2xl font-bold text-gray-900">Corregir documento</h1>
      <p class="text-gray-500 text-sm mt-1">Revisamos tu postulación y necesitamos que corrijas lo siguiente.</p>
    </div>

    <div id="alerta"></div>
    <div id="cargando" class="text-center text-gray-400 text-sm py-10">Cargando...</div>
    <form id="form-subsanar" class="hidden bg-white shadow-sm rounded-xl p-5 space-y-5"></form>
    <div id="resultado" class="hidden bg-white shadow-sm rounded-xl p-6 text-center space-y-3"></div>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/subsanar.js"></script>
</body>
</html>
