<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso Interno - ICAFAL</title>
<link rel="icon" href="../assets/img/logo-icafal-mark.png">
<script src="https://cdn.tailwindcss.com"></script>
<!-- ICAFAL_TEMA_MARCA v1 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // Tema de marca ICAFAL (naranjo real extraido del logo, HSL escalado a
  // una paleta de 11 tonos). Reemplaza el "blue" por defecto de Tailwind
  // -- toda la app ya usaba blue-* como unico color de acento, asi que
  // esto recolorea todo sin tocar ninguna clase en el HTML existente.
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          blue: {
            50: '#fdf5f2', 100: '#fae7e1', 200: '#fac9b7', 300: '#f7a587',
            400: '#f47c50', 500: '#f15922', 600: '#e1460e', 700: '#c03c0c',
            800: '#a23006', 900: '#802605', 950: '#531903',
          },
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
        },
      },
    },
  }
</script>
<style>
  h1, h2, h3 { font-family: 'Manrope', 'Inter', ui-sans-serif, system-ui, sans-serif; }
  input[type="checkbox"], input[type="radio"] { accent-color: #e1460e; }
</style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="max-w-sm w-full mx-4">
    <img src="../assets/img/logo-icafal.png" alt="ICAFAL Ingeniería y Construcción" class="h-14 mx-auto mb-6">
    <h1 class="text-xl font-bold text-gray-900 text-center mb-6">Acceso Interno RRHH</h1>
    <div id="alerta"></div>
    <form id="form-login" class="bg-white shadow-sm rounded-xl p-6 space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Correo</label>
        <input id="correo" type="email" required class="w-full border border-gray-300 rounded-lg px-3 py-2.5">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
        <input id="password" type="password" required class="w-full border border-gray-300 rounded-lg px-3 py-2.5">
      </div>
      <button type="submit" id="btn-login"
              class="w-full bg-gray-900 hover:bg-gray-800 text-white font-semibold rounded-lg py-3 transition">
        Ingresar
      </button>
    </form>
  </div>

  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
